<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Praxis — Knowledge → Action</title>
    <meta
      name="description"
      content="Praxis — a personal knowledge-to-action workspace. Convert insights into behavioral change."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <div id="main">
        <header id="topbar"></header>
        <div id="content"></div>
      </div>
    </div>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" aria-hidden="true"></div>

    <!-- Modal root -->
    <div id="modal-root" aria-hidden="true"></div>

    <!-- Conversion panel (always present, hidden via class) -->
    <div id="conversion-panel" aria-hidden="true"></div>

    <!-- Context menu root -->
    <div id="context-menu-root" aria-hidden="true"></div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Hidden file input for .txt import -->
    <input
      type="file"
      id="hidden-file-input"
      accept=".txt,text/plain"
      style="display: none"
    />

    <script type="module" src="js/app.js"></script>
  </body>
</html>
